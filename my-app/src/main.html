<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/main_style.css" />
    <link rel="icon" type="image/png" href="./images/favicon.svg">
    <title>«Приложение - Аудиоплеер»</title>
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper">
          <div class="header__logo">
            <a href="main.html" class="header__logo-link">
              <svg
                class="header__logo-img"
                width="33"
                height="28"
                aria-hidden="true"
              >
                <use href="./images/sprite.svg#logo-img-desktop"></use>
              </svg>
              <svg
                class="header__logo-title"
                width="142"
                height="13"
                aria-hidden="true"
              >
                <use href="./images/sprite.svg#logo-text"></use>
              </svg>
            </a>
          </div>

          <!-- Форма поиска -->
          <div class="header__center">
            <form class="header__form" action="/search" method="get">
              <div class="custom-input">
                <input
                  class="custom-input__search"
                  type="search"
                  id="search-input"
                  name="q"
                  placeholder="ЧТО БУДЕМ ИСКАТЬ?"
                  required
                />
                <button class="custom-input__btn btn" type="submit">
                  <svg
                    class="custom-input__img"
                    width="24"
                    height="24"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#magnifying"></use>
                  </svg>
                </button>
              </div>
            </form>
            <div class="header__user">
              <button class="header__user-btn btn" type="button">
                <!-- <picture>
                  <source
                    media="(max-width: 767px)"
                    srcset="
                      ./images/foto-user-mobile.png  1x,
                      ./images/foto-user@2mobile.png 2x
                    "
                  />
                  <source
                    media="(max-width: 1023px)"
                    srcset="
                      ./images/foto-user-desktop.png   1x,
                      ./images/foto-user-desktop@2x.png 2x
                    "
                  /> -->
                <img
                  class="header__user-img"
                  src="./images/avatar.png"
                  srcset="./images/avatar.png"
                  width="42"
                  height="42"
                  alt="Фотография пользователя"
                  onerror="
                    this.onerror = null;
                    this.src = './images/avatar.png';
                    this.srcset = '';
                  "
                />
                <!-- </picture> -->
                <span class="header__user-text">username</span>
                <svg
                  class="header__user-icon"
                  width="6"
                  height="10"
                  aria-hidden="true"
                >
                  <use href="./images/sprite.svg#arrow"></use>
                </svg>
              </button>
              <div class="header__card">
                <!-- Пример личного кабинета -->
                <!-- <div class="user-card__wrapper">
                  <div class="user-card__heading">
                    <h2 class="user-card__title">User</h2>
                    <button class="user-card__close" type="button">
                      <svg
                        class="user-card__icon"
                        width="24"
                        height="24"
                        aria-hidden="true"
                      >
                        <use xlink:href="./imagess/sprite.svg#icon-close"></use>
                      </svg>
                    </button>
                  </div>
                </div> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main>
      <!-- CATALOG -->
      <section class="catalog">
        <h1 class="visually-hidden">Аудифайлы и треки</h1>
        <div class="container">
          <!-- <h1 class="catalog__title">Аудифайлы и треки</h1> -->
          <div class="catalog__wrapper">
            <form class="catalog__form" action="#" method="POST">
              <fieldset class="catalog__form-group">
                <ul class="catalog__form-list">
                  <li class="catalog__form-item">
                    <div class="custom-radio">
                      <input
                        class="custom-radio__field visually-hidden"
                        id="radio-favorites"
                        type="radio"
                        name="playlist"
                        value="favorites"
                      />
                      <label class="custom-radio__label" for="radio-favorites">
                        <svg
                          class="custom-radio__icon"
                          width="32"
                          height="32"
                          aria-hidden="true"
                        >
                          <use href="./images/sprite.svg#note-img"></use>
                        </svg>

                        <svg
                          class="custom-radio__icon play"
                          width="24"
                          height="24"
                          aria-hidden="true"
                        >
                          <use href="./images/sprite.svg#play-img"></use>
                        </svg>
                        <span class="custom-radio__text">Избранное</span>
                      </label>
                    </div>
                  </li>
                  <li class="catalog__form-item">
                    <div class="custom-radio">
                      <input
                        class="custom-radio__field visually-hidden"
                        id="all-audio"
                        type="radio"
                        name="playlist"
                        value="audio"
                        checked
                      />
                      <label class="custom-radio__label" for="all-audio">
                        <svg
                          class="custom-radio__icon"
                          width="32"
                          height="32"
                          aria-hidden="true"
                        >
                          <use href="./images/sprite.svg#note-img"></use>
                        </svg>
                        <svg
                          class="custom-radio__icon play"
                          width="24"
                          height="24"
                          aria-hidden="true"
                        >
                          <use href="./images/sprite.svg#play-img"></use>
                        </svg>
                        <span class="custom-radio__text">Аудиокомпозиции</span>
                      </label>
                    </div>
                  </li>
                </ul>
              </fieldset>
            </form>
            <div class="catalog__wrapper-center">
              <h2 class="catalog__title">Аудифайлы и треки</h2>
              <!-- Карточка трека  -->
              <div class="tracks-scroll">
                <table class="catalog__table" id="catalog-table">
                  <thead class="catalog__table-title">
                    <tr class="catalog__table-list">
                      <th class="catalog__table-item">№</th>
                      <th class="catalog__table-item" data-sort="title">НАЗВАНИЕ</th>
                      <th class="catalog__table-item" data-sort="artist">АЛЬБОМ</th>
                      <th class="catalog__table-item" data-sort="createdAt">
                        <svg
                          class="catalog__table-icon"
                          width="16"
                          height="16"
                          aria-hidden="true"
                        >
                          <use href="./images/sprite.svg#calendar"></use>
                        </svg>
                      </th>
                      <th class="catalog__table-item" data-sort="duration">
                        <svg
                          class="catalog__table-icon"
                          width="16"
                          height="16"
                          aria-hidden="true"
                        >
                          <use href="./images/sprite.svg#time"></use>
                        </svg>
                      </th>
                    </tr>
                  </thead>
                  <!--TRACKS -->
                  <tbody id="tracks-tbody">
                    <!-- Rows will be inserted here -->
                  </tbody>
                </table>
              </div>

              <div class="catalog__pagination">

              </div>
            </div>
          </div>
        </div>
      </section>

      <!--!PLAYER-->

    </main>
    <footer class="footer">
      <div class="container">
        <div class="footer__player">
          <div class="footer__wrapper">
            <!-- Фаил который проигрывается плеером -->
            <img
              class="footer__wrapper-img"
              src="./images/img-audio/placeholder.png"
              width="60"
              height="60"
              alt="Постер музыкального трека"
            />
            <div class="footer__info">
              <div class="footer__top">
                <p class="footer__top-title" >Histoire Sans Nom</p>
                <svg
                  class="footer__top-icon"
                  width="24"
                  height="24"
                  aria-hidden="true"
                >
                  <use xlink:href="./images/sprite.svg#heart"></use>
                </svg>
              </div>
              <span class="footer__info-text"
                >Ludovico Einaudi, Czech National Symphony Orchestra</span
              >
            </div>
          </div>

          <!-- Controls -->
          <div class="footer__controls">
            <div class="footer__controlsOuter">
              <div class="footer__controlsInner-loading" id="loading"></div>
              <div class="footer__controlsInner">
                <div class="footer__btn" id="skip-forwardBtn">
                  <svg
                    class="footer__btn-icon"
                    width="16"
                    height="16"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#arrow-forward"></use>
                  </svg>
                </div>
                <div class="footer__btn" id="shuffleBtn">
                  <svg
                    class="footer__btn-icon"
                    width="16"
                    height="16"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#shuffle"></use>
                  </svg>
                </div>
                <div class="footer__btn" id="prevBtn">
                  <svg
                    class="footer__btn-icon"
                    width="16"
                    height="16"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#skipBack"></use>
                  </svg>
                </div>
                <div class="footer__btn" id="play-pauseBtn">
                  <svg
                    class="footer__btn-play"
                    width="12"
                    height="15"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#play"></use>
                  </svg>
                    <svg
                    class="footer__btn-pause"
                    width="24"
                    height="24"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#pause"></use>
                  </svg>
                </div>
                <div class="footer__btn" id="nextBtn">
                  <svg
                    class="footer__btn-icon"
                    width="16"
                    height="16"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#next-track"></use>
                  </svg>
                </div>
                <div class="footer__btn" id="repeatBtn">
                  <svg
                    class="footer__btn-icon"
                    width="16"
                    height="16"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#repeat"></use>
                  </svg>
                </div>
                <div class="footer__btn" id="skip-backBtn">
                  <svg
                    class="footer__btn-icon"
                    width="16"
                    height="16"
                    aria-hidden="true"
                  >
                    <use href="./images/sprite.svg#arrow-back"></use>
                  </svg>
                </div>
              </div>
              <!-- Progress -->
              <div class="footer__controlsProgress">
                <div class="footer__timer" id="timer">0:00</div>
                <!-- <div class="footer__waveform" id="waveform"></div> -->
                <div class="footer__line">
                  <div class="footer__bar" id="bar"></div>
                  <div class="footer__progress" id="progress"></div>
                </div>
                <div class="footer__duration" id="duration">0:00</div>
              </div>
            </div>
          </div>

          <!-- Volume -->
          <div class="footer__volume">
            <svg class="footer__icon" width="16" height="16" aria-hidden="true">
              <use href="./images/sprite.svg#speakerLow"></use>
            </svg>
            <div class="footer__progress-track">
              <input
                type="range"
                class="footer__volume-slider"
                min="0"
                max="100"
                value="10"
                id="volume"
              />
              <div class="footer__progressBar" id="progressBar"></div>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <!-- <script src="./ts/main.ts" type="module"></script> -->
    <script src="./howler.core.js"></script>
  </body>
</html>
